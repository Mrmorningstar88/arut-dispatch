name: telegram-dispatch
on:
  schedule:
    - cron: '0,15,30,45 5,7,10,11,16,17 * * *'
  workflow_dispatch: {}
concurrency:
  group: telegram-dispatch
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Post due items
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, html, sys, time, datetime as dt
          from zoneinfo import ZoneInfo
          import requests

          TZ = ZoneInfo("Asia/Almaty")
          now = dt.datetime.now(TZ)
          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          API = "https://api.telegram.org/bot" + TOKEN
          CHANNEL, OWNER = "-1001286486503", "7604569267"
          LEAD, WINDOW = 12, 150
          print("now (Almaty):", now.strftime("%Y-%m-%d %H:%M"), "| token length:", len(TOKEN))
          me = requests.get(API + "/getMe", timeout=30).json()
          print("bot check:", "OK @" + me["result"]["username"] if me.get("ok") else me)

          def norm(s):
              return re.sub(r"\W+", "", html.unescape(re.sub(r"<[^>]+>", " ", s)).lower())[:120]

          def channel_texts():
              for _ in range(4):
                  try:
                      p = requests.get("https://t.me/s/arutnews", headers={"User-Agent": "Mozilla/5.0"}, timeout=30).text
                      if "tgme_widget_message" in p:
                          return [norm(t) for t in re.findall(r'tgme_widget_message_text[^>]*>(.*?)</div>', p, re.S)]
                  except Exception as e:
                      print("channel read error:", e)
                  time.sleep(15)
              return None

          def alert(msg):
              r = requests.post(API + "/sendMessage", data={"chat_id": OWNER, "text": "⚠️ ARUT dispatcher (GitHub): " + msg}, timeout=30).json()
              print("alert sent:", r.get("ok"), r.get("description", ""))

          path = f"queue/{now.date().isoformat()}.json"
          if not os.path.exists(path):
              print("no queue for today:", path)
              if now.hour == 10 and now.minute < 30:
                  alert(f"no Telegram queue for {now.date()} — the 07:40 run did not save it")
              sys.exit(0)

          q = json.load(open(path, encoding="utf-8"))
          problems = []
          for it in sorted(q["items"], key=lambda x: x["time"]):
              h, m = map(int, it["time"].split(":"))
              due = now.replace(hour=h, minute=m, second=0, microsecond=0)
              mins = (due - now).total_seconds() / 60
              if mins > LEAD:
                  print(it["time"], "WAIT"); continue
              if -mins > WINDOW:
                  print(it["time"], "older than window, skipped"); continue
              if mins > 0:
                  time.sleep(mins * 60)
              cap = it["caption"].strip()
              texts = channel_texts()
              if texts is None:
                  problems.append(f'{it["time"]} Almaty: channel page unreadable, not sent'); continue
              if norm(cap) in texts:
                  print(it["time"], "already posted"); continue
              r = requests.post(API + "/sendPhoto", data={"chat_id": CHANNEL, "photo": it["image_url"], "caption": cap}, timeout=120).json()
              print(it["time"], "send by URL:", r.get("ok"), r.get("description", ""))
              if not r.get("ok"):
                  img = requests.get(it["image_url"], headers={"User-Agent": "Mozilla/5.0"}, timeout=60).content
                  r = requests.post(API + "/sendPhoto", data={"chat_id": CHANNEL, "caption": cap},
                                    files={"photo": ("image.png", img)}, timeout=120).json()
                  print(it["time"], "send by upload:", r.get("ok"), r.get("description", ""))
              if r.get("ok"):
                  print(it["time"], "POSTED msg", r["result"]["message_id"])
              else:
                  problems.append(f'{it["time"]} Almaty: send failed: {r.get("description")}')
          if problems:
              print("PROBLEMS:", problems)
              alert("; ".join(problems))
              sys.exit(1)
          PY
